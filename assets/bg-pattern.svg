<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5">
  <!-- Fundo do site público: desenhos de comida em traço, repetidos (ver body::before em site.css). -->
